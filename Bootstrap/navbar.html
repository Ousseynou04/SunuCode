<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Barre de navigation</title>
</head>
<body>

    <header>
        <nav>
            <div>
                <nav class="navbar navbar-expand-sm navbar-dark mt-0 py-3 bg-warning">
                    <div class="container">
                        <a class="navbar-brand" href="#"><img src="https://i.pinimg.com/736x/d4/68/3d/d4683dc83b4b52bfa3105548abc0a565.jpg" class="rounded rounded-circle" width="70" height="55" alt=""> Barça</a>
                        <button
                            class="navbar-toggler d-lg-none"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#collapsibleNavId"
                            aria-controls="collapsibleNavId"
                            aria-expanded="false"
                            aria-label="Toggle navigation"
                        >
                            <!-- <span class="navbar-toggler-icon"></span> -->
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf80gRiJMqkTnOg1_EeW171Iq8IpwuPEZFlc1uGTDy2WhgJIeTqABO3wU&s=10" width="55" height="40" alt="">
                        </button>
                        <div class="collapse navbar-collapse" id="collapsibleNavId">
                            <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                                <li class="nav-item">
                                    <a class="nav-link active" href="#" aria-current="page"
                                        >Home
                                        <span class="visually-hidden">(current)</span></a
                                    >
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">Link</a>
                                </li>
                                <li class="nav-item dropdown">
                                    <a
                                        class="nav-link dropdown-toggle"
                                        href="#"
                                        id="dropdownId"
                                        data-bs-toggle="dropdown"
                                        aria-haspopup="true"
                                        aria-expanded="false"
                                        >Dropdown</a
                                    >
                                    <div
                                        class="dropdown-menu"
                                        aria-labelledby="dropdownId"
                                    >
                                        <a class="dropdown-item" href="#"
                                            >Accueil</a
                                        >
                                        <a class="dropdown-item" href="#"
                                            >A propos</a
                                        >
                                    </div>
                                </li>
                            </ul>
                            
                        </div>
                    </div>
                </nav>
                
            </div>
        </nav>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
