<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulaire</title>
</head>
<body>
    <fieldset>
        <legend align="center">Formulaire d'inscription</legend>

        <form action="">
            <label for="">Prenom</label> 
            <input type="text" required minlength="2" maxlength="10" placeholder="veuillez saisir votre prenom"> <br>
            <br> <label for="">Prix</label>
            <input type="number" step="0.01" min="0" value="0" max="10"> <br>

            <br> <label for="">Sexe :</label> 
            M <input type="radio" name="sexe" id="">
            F <input type="radio" name="sexe" checked> <br>

            <br> <label for="">Langues :</label> 
            Fr <input type="checkbox">
            En <input type="checkbox">
            Es <input type="checkbox">
            Wo <input type="checkbox" checked> <br>

            <br> <label for="">Date de Naissance :</label>
            <input type="date"> <br>
            <br> <label for="">Heure de démarrage :</label>
            <input type="time"> <br>
            <br> <label for="">Date & Heure :</label>
            <input type="datetime-local"> <br>
            <br> <label for="">Mois :</label>
            <input type="month"> <br>
            <br> <label for="">semaine :</label>
            <input type="week"> <br>

            <br> <label for="">Pays</label>
            <select name="" id="">
                <option value="">Veuillez selectionner un pays</option>
                <option value="" selected>Senegal</option>
                <option value="">Mali</option>
                <option value="">Gambie</option>
                <option value="">Mauritanie</option>
            </select> <br>

            <br> <label for="">Message</label> <br>
            <textarea name="" id="" rows="10" cols="50"></textarea> <br>
            <br> <label for="">Email :</label>
            <input type="email">  <br>
            <br> <label for="">Mot de passe :</label>
            <input type="password"> <br>
            <br> <label for="">Couleur :</label>
            <input type="color"> <br>
            <br> <label for="">Image de profil :</label>
            <input type="file"> <br>
            <br> <label for="">Plage :</label>
            <input type="range"> <br>

            <br> <input type="submit" value="s'inscrire"> 
                <input type="reset" value="Annuler">
        </form>
    </fieldset>
</body>
</html>
