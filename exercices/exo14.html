<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exo14</title>

    <style>
        
        p{
            border: 20px red ridge;
            border-bottom-right-radius:50px ;
            font-size: 30px;
            text-align: center;
            padding: 20px;
            max-width: 450px;
            margin: 50px auto;
            box-shadow:-20px -14px 20px 0px rgba(0, 0, 0, 1.00), 20px 19px 20px 0px rgba(0, 0, 0, 1.00);
            transition: all 3s ease;
        }

        p:hover{
            background-color: black;
            color: white;
            border: 20px red ridge;
            height:720px;
            text-align: center;
            font-size: 90px;
        }

    </style>
