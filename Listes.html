<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les listes</title>
</head>
<body>
    
    <h1>Listes Ordonnees</h1>
    <ol type="I" start="4">
        <li>Introduction </li>
        <li>Developpement</li>
        <li>Conclusion</li>
    </ol>


    <h1>Listes non Ordonnees</h1>
    <ul type="circle">
        <li>Introduction</li>
        <li>Developpement</li>
        <li>Conclusion</li>
    </ul>


    <h1>Listes de Définition</h1>

    <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup language</dd>
    </dl>

    <dl>
        <dt>CSS</dt>
        <dd>Cascading stylesheet</dd>
    </dl>


</body>
</html>
